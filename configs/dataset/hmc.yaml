# HMC sleep staging v1.1, EEG C4-M1, W / N1 / N2 / N3 / REM (confirmatory dataset, ADR 0028 §4); paths relative to KAI_WORK=transfer/hmc
id: hmc-v1
windows: data/processed/hmc.npz
splits_dir: data/splits
folds_dir: artifacts/folds
f_raw: wave  # incumbent; the per-fold choice below picks between the candidates (ADR 0028 §4, §7)
