# Pin every `rev` with `pre-commit autoupdate --freeze` before the first team commit (PRD §21.5).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e  # frozen: v0.17.0
    hooks: [{id: ruff, args: [--fix]}, {id: ruff-format}]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - {id: check-added-large-files, args: [--maxkb=500]}
      - {id: check-yaml}
      - {id: end-of-file-fixer}
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks: [{id: gitleaks}]
  - repo: local
    hooks:
      - {id: mypy, name: mypy (strict pkgs), entry: uv run --no-sync mypy src/kai/contracts src/kai/certify src/kai/select, language: system, pass_filenames: false}
      - {id: no-l0-splits, name: ban random-window splits, entry: uv run --no-sync python scripts/check_no_l0_splits.py, language: system, pass_filenames: false}
