<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090F"/>
      <stop offset="50%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C32"/>
      <stop offset="100%" stop-color="#FF385C"/>
    </linearGradient>
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#162032" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 400; opacity: 0.3; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes blinkBeacon {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes floatGrid {
        0% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
        100% { transform: translateY(0); }
      }
      .pulse-line {
        stroke-dasharray: 20, 10;
        animation: pulseBeam 4s linear infinite;
      }
      .beacon {
        animation: blinkBeacon 2s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="340" fill="url(#bgGrad)"/>
  <rect width="1000" height="340" fill="url(#techGrid)"/>

  <!-- Accent Border Glows -->
  <rect x="0" y="0" width="1000" height="3" fill="url(#cyanGrad)"/>
  <rect x="0" y="337" width="1000" height="3" fill="url(#orangeGrad)"/>

  <!-- Left Header Content -->
  <g transform="translate(50, 45)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#101D30" stroke="#00BFFF" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#00E5FF" class="beacon"/>
    <text x="24" y="16" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#00E5FF" letter-spacing="1.5">RESEARCH PLATFORM v2.0</text>

    <!-- Main Title -->
    <text x="0" y="70" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Rep<tspan fill="#00E5FF">Route</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00BFFF" letter-spacing="1.2">
      RISK-CERTIFIED ADAPTIVE EDGE–CLOUD OFFLOADING
    </text>

    <text x="0" y="125" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
      Sufficiency-Certified Representation Selection for Industrial Predictive Maintenance
    </text>

    <!-- Tagline Box -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="460" height="38" rx="6" fill="#0C1424" stroke="#1E2D3D" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="38" rx="2" fill="#FF8C32"/>
      <text x="16" y="24" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#F1F5F9" font-style="italic">
        "Certify the Decision. Minimize the Transmission. Preserve the Diagnosis."
      </text>
    </g>

    <!-- Quick Spec Chips -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="105" height="24" rx="4" fill="#131C2D" stroke="#1E324A" stroke-width="1"/>
      <text x="8" y="16" font-family="'Segoe UI', monospace" font-size="11" fill="#38BDF8">64 kHz PU Bearing</text>

      <rect x="115" y="0" width="95" height="24" rx="4" fill="#131C2D" stroke="#1E324A" stroke-width="1"/>
      <text x="123" y="16" font-family="'Segoe UI', monospace" font-size="11" fill="#34D399">E[Risk] ≤ α = 0.05</text>

      <rect x="220" y="0" width="110" height="24" rx="4" fill="#131C2D" stroke="#1E324A" stroke-width="1"/>
      <text x="228" y="16" font-family="'Segoe UI', monospace" font-size="11" fill="#FB923C">8,190 B → 16 B</text>

      <rect x="340" y="0" width="105" height="24" rx="4" fill="#131C2D" stroke="#1E324A" stroke-width="1"/>
      <text x="348" y="16" font-family="'Segoe UI', monospace" font-size="11" fill="#C084FC">No Edge Torch</text>
    </g>
  </g>

  <!-- Right Visual: Futuristic Edge-Cloud Pipeline Graphic -->
  <g transform="translate(540, 30)">
    <!-- Boundary Box -->
    <rect x="0" y="0" width="410" height="275" rx="12" fill="#0B111D" stroke="#1A283C" stroke-width="1.5"/>

    <!-- Edge vs Cloud Zone Headers -->
    <rect x="15" y="15" width="170" height="22" rx="4" fill="#0E1E34" stroke="#00BFFF" stroke-width="0.8"/>
    <text x="24" y="30" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#00E5FF" letter-spacing="1">EDGE NODE (numpy+onnx)</text>

    <rect x="225" y="15" width="170" height="22" rx="4" fill="#241310" stroke="#FF8C32" stroke-width="0.8"/>
    <text x="240" y="30" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#FF8C32" letter-spacing="1">CLOUD (LightGBM+heads)</text>

    <!-- Node 1: Vibration Sensor -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="150" height="42" rx="6" fill="#101827" stroke="#00BFFF" stroke-width="1"/>
      <circle cx="16" cy="21" r="6" fill="#00E5FF" filter="url(#glowCyan)"/>
      <text x="30" y="18" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#F1F5F9">64 kHz Vibration</text>
      <text x="30" y="32" font-family="'Segoe UI', monospace" font-size="9" fill="#94A3B8">N=4,096 · 8,190 Bytes</text>
    </g>

    <!-- Waveform Mini Graphic -->
    <path d="M 180 76 L 190 68 L 195 84 L 202 70 L 210 76" fill="none" stroke="#00E5FF" stroke-width="1.5"/>

    <!-- Node 2: Statistical Risk Gate -->
    <g transform="translate(25, 115)">
      <rect x="0" y="0" width="150" height="46" rx="6" fill="#0F212D" stroke="#22C55E" stroke-width="1.2"/>
      <circle cx="16" cy="23" r="6" fill="#22C55E"/>
      <text x="30" y="20" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#22C55E">CRC Safe Set S_λ</text>
      <text x="30" y="34" font-family="'Segoe UI', monospace" font-size="9" fill="#A7F3D0">E[Disagreement] ≤ α</text>
    </g>

    <!-- Node 3: Cost Optimizer -->
    <g transform="translate(25, 180)">
      <rect x="0" y="0" width="150" height="44" rx="6" fill="#101827" stroke="#00BFFF" stroke-width="1"/>
      <circle cx="16" cy="22" r="5" fill="#38BDF8"/>
      <text x="30" y="19" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#F1F5F9">Select-then-Encode</text>
      <text x="30" y="33" font-family="'Segoe UI', monospace" font-size="9" fill="#38BDF8">Min cost: R6 (16 B) / R4</text>
    </g>

    <!-- Dynamic Transmission Beam across Channel -->
    <path d="M 175 202 L 235 202" fill="none" stroke="#00E5FF" stroke-width="2.5" class="pulse-line"/>
    <text x="180" y="195" font-family="'Segoe UI', monospace" font-size="8.5" fill="#00E5FF">28B frame</text>

    <!-- Node 4: Cloud Diagnostic Server -->
    <g transform="translate(235, 75)">
      <rect x="0" y="0" width="150" height="66" rx="6" fill="#1C1318" stroke="#FF8C32" stroke-width="1.2"/>
      <circle cx="16" cy="22" r="5" fill="#FF8C32" filter="url(#glowOrange)"/>
      <text x="30" y="20" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#FF8C32">Cloud Inference</text>
      <text x="30" y="35" font-family="'Segoe UI', monospace" font-size="9" fill="#FDBA74">Async Head Zoo / f_raw</text>
      <text x="30" y="50" font-family="'Segoe UI', monospace" font-size="8.5" fill="#94A3B8">Contract Hash Check</text>
    </g>

    <!-- Node 5: Real-time Telemetry & Verdict -->
    <g transform="translate(235, 160)">
      <rect x="0" y="0" width="150" height="64" rx="6" fill="#101C24" stroke="#22C55E" stroke-width="1"/>
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#22C55E">DIAGNOSTIC VERDICT</text>
      <rect x="12" y="27" width="126" height="18" rx="3" fill="#042F2E"/>
      <text x="18" y="40" font-family="'Segoe UI', monospace" font-size="9" font-weight="700" fill="#5EEAD4">HEALTHY / OR / IR FAULT</text>
      <text x="12" y="56" font-family="'Segoe UI', monospace" font-size="8.5" fill="#94A3B8">Telemetry + ACI feedback</text>
    </g>

    <!-- Status Bar at bottom of graphic -->
    <rect x="15" y="240" width="380" height="22" rx="4" fill="#0A0E17"/>
    <circle cx="28" cy="251" r="3.5" fill="#22C55E"/>
    <text x="38" y="254" font-family="'Segoe UI', monospace" font-size="9" fill="#94A3B8">1,296 SIMULATION CELLS · DES + DOCKER NETEM VERIFIED</text>
  </g>
</svg>